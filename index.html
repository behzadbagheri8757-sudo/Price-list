<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیست قیمت</title>
<style>
:root{
  --bg:#0b0b12; --bg-2:#12121c; --card:#171722; --card-2:#1e1e2c;
  --border:#2a2a3d; --text:#ececf3; --muted:#8b8ba3;
  --accent:#e0b64a; --accent-2:#f5d478;
  --danger:#e25757; --success:#4ec98b;
  --radius:14px; --shadow:0 10px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  background:radial-gradient(circle at top right,#1a1a2e 0%,var(--bg) 45%);
  color:var(--text); min-height:100vh; line-height:1.7;
  padding:24px 16px 80px; -webkit-font-smoothing:antialiased;
}
.container{max-width:1100px;margin:0 auto}

/* ---------- Header ---------- */
.header{
  display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  padding:24px 28px;
  background:linear-gradient(135deg,var(--card),var(--card-2));
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:20px;position:relative;overflow:hidden;
}
.header::before{
  content:'';position:absolute;top:0;right:0;left:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.title-wrap{display:flex;align-items:center;gap:14px}
.logo{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#1a1a2e;font-weight:800;font-size:22px;
  box-shadow:0 6px 18px rgba(224,182,74,.3);
}
.title{font-size:22px;font-weight:800}
.subtitle{font-size:13px;color:var(--muted)}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:10px;border:1px solid var(--border);
  background:var(--card-2);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s ease;user-select:none;
}
.btn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(0)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#1a1a2e;border-color:transparent;
}
.btn-primary:hover{color:#1a1a2e;box-shadow:0 8px 24px rgba(224,182,74,.35)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{border-color:var(--danger);color:var(--danger)}
.btn-sm{padding:6px 12px;font-size:13px}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-box{flex:1;min-width:220px;position:relative}
.search-box input{
  width:100%;padding:13px 46px 13px 16px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-family:inherit;font-size:15px;transition:.2s;
}
.search-box input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(224,182,74,.12);
}
.search-box svg{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);
}
.stat{
  padding:10px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;font-size:13px;color:var(--muted);
}
.stat b{color:var(--accent);font-weight:700}

/* ---------- Table ---------- */
.table-wrap{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
}
table{width:100%;border-collapse:collapse}
thead{background:var(--card-2)}
thead th{
  padding:16px 18px;text-align:right;font-size:13px;font-weight:700;
  color:var(--muted);letter-spacing:.3px;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(224,182,74,.04)}
tbody td{padding:15px 18px;font-size:15px;vertical-align:middle}
.row-num{color:var(--muted);font-size:13px;font-weight:600;width:60px}
.item-name{font-weight:700}
.item-desc{font-size:13px;color:var(--muted);margin-top:2px}
.price{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{color:var(--muted);font-weight:500;font-size:12px}
.badge{
  display:inline-block;padding:3px 10px;border-radius:6px;
  background:rgba(224,182,74,.12);color:var(--accent);
  font-size:12px;font-weight:600;
}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.row-actions{display:flex;gap:6px}
.icon-btn{
  width:34px;height:34px;border-radius:8px;
  border:1px solid var(--border);background:var(--card-2);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s;
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger)}

/* ---------- Banner ---------- */
.banner{
  display:none;align-items:center;gap:12px;
  padding:14px 18px;margin-bottom:16px;
  background:rgba(224,182,74,.08);
  border:1px solid rgba(224,182,74,.25);
  border-radius:12px;font-size:14px;color:var(--accent-2);
}
.banner.show{display:flex}
.banner button{margin-inline-start:auto}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);display:none;place-items:center;
  padding:20px;z-index:100;
}
.modal-backdrop.open{display:grid}
.modal{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px;
  width:100%;max-width:480px;box-shadow:var(--shadow);
  animation:pop .25s ease;
}
@keyframes pop{
  from{opacity:0;transform:scale(.95) translateY(10px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.modal h3{font-size:18px;margin-bottom:20px;color:var(--accent)}
.form-group{margin-bottom:16px}
.form-group label{
  display:block;font-size:13px;color:var(--muted);
  margin-bottom:6px;font-weight:600;
}
.form-group input,.form-group textarea{
  width:100%;padding:11px 14px;
  background:var(--card-2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);
  font-family:inherit;font-size:14px;transition:border-color .2s;
}
.form-group input:focus,.form-group textarea:focus{
  outline:none;border-color:var(--accent);
}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:22px}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--card-2);border:1px solid var(--border);
  padding:14px 22px;border-radius:12px;
  box-shadow:var(--shadow);font-size:14px;
  opacity:0;transition:.3s ease;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}

@media (max-width:640px){
  body{padding:16px 10px 60px}
  .header{padding:18px}
  .title{font-size:18px}
  thead th,tbody td{padding:12px;font-size:14px}
  .col-desc,.col-cat{display:none}
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">

  <!-- هدر -->
  <header class="header">
    <div class="title-wrap">
      <div class="logo">₮</div>
      <div>
        <div class="title">لیست قیمت</div>
        <div class="subtitle" id="dateTime">—</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="adminToggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span id="adminLabel">حالت مدیریت</span>
      </button>
    </div>
  </header>

  <!-- بنر حالت ویرایش -->
  <div class="banner" id="banner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
    <span>شما در حال مشاهده نسخه ذخیره‌شده محلی هستید. برای انتشار، خروجی JSON بگیرید و در گیت‌هاب جایگزین کنید.</span>
    <button class="btn btn-sm btn-danger" id="resetBtn">بازنشانی</button>
  </div>

  <!-- نوار مدیریت -->
  <div class="toolbar" id="adminBar" style="display:none">
    <button class="btn btn-primary" id="addBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      افزودن مورد جدید
    </button>
    <button class="btn" id="exportBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      خروجی JSON
    </button>
    <button class="btn" id="importBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg>
      ورود JSON
    </button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <!-- جستجو -->
  <div class="toolbar">
    <div class="search-box">
      <input type="search" id="search" placeholder="جستجو در نام، دسته یا توضیحات...">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <div class="stat">تعداد: <b id="count">0</b></div>
  </div>

  <!-- جدول -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>نام کالا / خدمت</th>
          <th class="col-cat">دسته</th>
          <th>واحد</th>
          <th>قیمت</th>
          <th class="col-desc">توضیحات</th>
          <th class="actions-col" style="display:none">عملیات</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<!-- مودال ویرایش/افزودن -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modalTitle">افزودن مورد جدید</h3>
    <form id="itemForm">
      <div class="form-group">
        <label>نام کالا / خدمت *</label>
        <input type="text" id="f_name" required placeholder="مثال: کاغذ A4">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>دسته‌بندی</label>
          <input type="text" id="f_category" placeholder="مثال: لوازم اداری">
        </div>
        <div class="form-group">
          <label>واحد</label>
          <input type="text" id="f_unit" placeholder="مثال: بسته" value="عدد">
        </div>
      </div>
      <div class="form-group">
        <label>قیمت (تومان) *</label>
        <input type="text" id="f_price" required inputmode="numeric" placeholder="مثال: 150000">
      </div>
      <div class="form-group">
        <label>توضیحات</label>
        <textarea id="f_description" rows="2" placeholder="اختیاری..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">ذخیره</button>
        <button type="button" class="btn" id="cancelBtn">انصراف</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ تنظیمات ============ */
const DATA_URL = 'prices.json';
const STORAGE_KEY = 'pricelist_items_v1';

/* ============ وضعیت ============ */
let items = [];
let filtered = [];
let isAdmin = false;
let editingIndex = -1;

/* ============ ابزارها ============ */
const $ = s => document.querySelector(s);
const faDigits = '۰۱۲۳۴۵۶۷۸۹';
const arDigits = '٠١٢٣٤٥٦٧٨٩';

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function toFa(str){
  return String(str).replace(/\d/g, d => faDigits[d]);
}
function normalize(text){
  if(!text) return '';
  return String(text)
    .replace(/[يى]/g,'ی').replace(/ك/g,'ک')
    .replace(/[ۀهٔ]/g,'ه').replace(/[أإآا]/g,'ا')
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/\u200c/g,' ')
    .toLowerCase().trim();
}
function parseNum(str){
  return Number(
    String(str ?? '')
      .replace(/[۰-۹]/g, d => faDigits.indexOf(d))
      .replace(/[٠-٩]/g, d => arDigits.indexOf(d))
      .replace(/[^\d.-]/g,'')
  ) || 0;
}
function formatPrice(n){
  return toFa(Number(n).toLocaleString('en-US'));
}

/* ============ Toast ============ */
let toastTimer;
function toast(msg, type=''){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ============ تاریخ شمسی ============ */
function updateDateTime(){
  try{
    const fmt = new Intl.DateTimeFormat('fa-IR', {
      dateStyle:'full', timeStyle:'short', calendar:'persian'
    });
    $('#dateTime').textContent = fmt.format(new Date());
  }catch(e){ $('#dateTime').textContent = new Date().toLocaleString('fa-IR'); }
}

/* ============ بارگذاری داده ============ */
async function loadData(){
  // ۱) اول localStorage
  const local = localStorage.getItem(STORAGE_KEY);
  if(local){
    try{
      const parsed = JSON.parse(local);
      items = Array.isArray(parsed) ? parsed : (parsed.items || []);
      $('#banner').classList.add('show');
      render();
      return;
    }catch(e){ /* ادامه بده */ }
  }
  // ۲) سپس فایل JSON
  try{
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    items = Array.isArray(data) ? data : (data.items || []);
  }catch(e){
    console.warn('خطا در بارگذاری prices.json:', e);
    items = [];
  }
  render();
}

/* ============ ذخیره محلی ============ */
function saveLocal(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  $('#banner').classList.add('show');
}

/* ============ رندر ============ */
function render(){
  const q = normalize($('#search').value);
  filtered = q
    ? items.filter(it =>
        normalize(it.name).includes(q) ||
        normalize(it.category).includes(q) ||
        normalize(it.description).includes(q)
      )
    : items;

  const tbody = $('#tbody');
  const actionsCol = document.querySelector('.actions-col');

  if(!filtered.length){
    tbody.innerHTML = `<tr><td colspan="${isAdmin ? 7 : 6}" class="empty">
      ${q ? 'موردی یافت نشد.' : 'هنوز موردی اضافه نشده است.'}
    </td></tr>`;
    $('#count').textContent = toFa(filtered.length);
    return;
  }

  tbody.innerHTML = filtered.map((it, i) => {
    const idx = items.indexOf(it);
    return `
      <tr>
        <td class="row-num">${toFa(i + 1)}</td>
        <td>
          <div class="item-name">${esc(it.name || '—')}</div>
        </td>
        <td class="col-cat">${it.category ? `<span class="badge">${esc(it.category)}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
        <td>${esc(it.unit || 'عدد')}</td>
        <td class="price">${formatPrice(it.price)} <small>تومان</small></td>
        <td class="col-desc"><span class="item-desc">${esc(it.description || '—')}</span></td>
        ${isAdmin ? `
        <td class="actions-col">
          <div class="row-actions">
            <button class="icon-btn" title="ویرایش" onclick="editItem(${idx})">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
            </button>
            <button class="icon-btn danger" title="حذف" onclick="deleteItem(${idx})">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </td>` : ''}
      </tr>`;
  }).join('');

  actionsCol.style.display = isAdmin ? '' : 'none';
  $('#count').textContent = toFa(filtered.length);
}

/* ============ مودال ============ */
function openModal(title){
  $('#modalTitle').textContent = title;
  $('#modal').classList.add('open');
}
function closeModal(){
  $('#modal').classList.remove('open');
  $('#itemForm').reset();
  editingIndex = -1;
}
function editItem(idx){
  const it = items[idx];
  if(!it) return;
  editingIndex = idx;
  $('#f_name').value = it.name || '';
  $('#f_category').value = it.category || '';
  $('#f_unit').value = it.unit || 'عدد';
  $('#f_price').value = it.price || '';
  $('#f_description').value = it.description || '';
  openModal('ویرایش مورد');
}
function deleteItem(idx){
  if(!confirm('این مورد حذف شود؟')) return;
  items.splice(idx, 1);
  saveLocal();
  render();
  toast('حذف شد', 'success');
}

/* ============ فرم ============ */
$('#itemForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    name: $('#f_name').value.trim(),
    category: $('#f_category').value.trim(),
    unit: $('#f_unit').value.trim() || 'عدد',
    price: parseNum($('#f_price').value),
    description: $('#f_description').value.trim()
  };
  if(!data.name){ toast('نام الزامی است', 'error'); return; }
  if(editingIndex >= 0){
    items[editingIndex] = { ...items[editingIndex], ...data };
    toast('ویرایش شد', 'success');
  }else{
    items.push(data);
    toast('اضافه شد', 'success');
  }
  saveLocal();
  render();
  closeModal();
});
$('#cancelBtn').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => {
  if(e.target.id === 'modal') closeModal();
});

/* ============ خروجی / ورود ============ */
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'prices.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('فایل prices.json دانلود شد', 'success');
});

$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      items = Array.isArray(data) ? data : (data.items || []);
      saveLocal();
      render();
      toast('فایل وارد شد', 'success');
    }catch(err){
      toast('فایل نامعتبر است', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============ بازنشانی ============ */
$('#resetBtn').addEventListener('click', async () => {
  if(!confirm('همه تغییرات محلی حذف و به نسخه اصلی سایت برگردیم؟')) return;
  localStorage.removeItem(STORAGE_KEY);
  $('#banner').classList.remove('show');
  items = [];
  await loadData();
  toast('بازنشانی شد', 'success');
});

/* ============ حالت مدیریت ============ */
$('#adminToggle').addEventListener('click', () => {
  isAdmin = !isAdmin;
  $('#adminLabel').textContent = isAdmin ? 'خروج از مدیریت' : 'حالت مدیریت';
  $('#adminBar').style.display = isAdmin ? 'flex' : 'none';
  if(!isAdmin) closeModal();
  render();
});
$('#addBtn').addEventListener('click', () => {
  editingIndex = -1;
  $('#itemForm').reset();
  $('#f_unit').value = 'عدد';
  openModal('افزودن مورد جدید');
});
